services:
  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: shellherd-server:local
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    environment:
      # Behind the host reverse proxy; remove for direct operation without a proxy.
      SHELLHERD_SERVER_TRUSTED_PROXY: "1"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - server-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  server-data:
