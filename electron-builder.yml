appId: io.github.pelmenipower.shellherd
productName: Shellherd
copyright: Copyright © 2026 Alexander Schmidt

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - '!out/rdp-host/**'
  - '!out/hello/**'
  - package.json
  # Build leftovers nobody loads at runtime: sourcemaps, TypeScript sources, node-pty's C++ tree.
  - '!**/node_modules/**/*.{map,ts,mts,cts}'
  - '!**/node_modules/node-pty/{deps,third_party,src,scripts}/**'

# Chromium's own UI strings only; the app ships its own catalogs in src/shared/locales.
electronLanguages:
  - de
  - en-US

# Read at runtime via process.resourcesPath (see src/main/brand.ts, src/main/rdp/ipc.ts and src/main/vault/ipc.ts).
extraResources:
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/icon.png
    to: icon.png

# Rebuild native dependencies on the target OS, against the packaged Electron version.
npmRebuild: true
asarUnpack:
  - '**/node_modules/node-pty/**'
  - '**/*.node'

win:
  extraResources:
    - from: out/rdp-host
      to: rdp-host
    - from: out/hello
      to: hello
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}
  multiLanguageInstaller: true
  installerLanguages:
    - de_DE
    - en_US
  displayLanguageSelector: false

portable:
  artifactName: ${productName}-Portable-${version}.${ext}

afterPack: scripts/linux-after-pack.cjs

publish: null

linux:
  syncDesktopName: true
  executableName: shellherd
  icon: resources/icon.png
  category: System
  maintainer: Alexander Schmidt <pelmenipower@users.noreply.github.com>
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
  desktop:
    entry:
      Name: Shellherd
      Comment: Encrypted connection manager for SSH and infrastructure
      Terminal: 'false'
      Keywords: SSH;SFTP;Terminal;Docker;Kubernetes;

appImage:
  executableArgs: []
  artifactName: ${productName}-${version}-${arch}.${ext}

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2 | libasound2t64
    - libgbm1
  artifactName: ${productName}-${version}-amd64.${ext}
