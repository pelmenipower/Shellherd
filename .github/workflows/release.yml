# Builds Windows and Linux before publishing one release for a version without a tag.
# Trigger: merging staging into main. Merges that keep the version (docs, tooling) publish nothing.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Two quick merges must not publish the same version twice.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v5

      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null || true)" = true ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$tag ist schon veröffentlicht, kein Release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.exists == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: dist:win
            artifact: windows-x64
          - os: ubuntu-latest
            command: dist:linux
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 libx11-dev libxkbfile-dev xvfb libgtk-3-0 libnss3 libasound2t64
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.command }}
      - if: runner.os == 'Linux'
        name: Verify Linux packages and installed application
        run: |
          node scripts/check-linux-package.mjs
          sudo apt-get install -y ./dist/Shellherd-*-amd64.deb
          xvfb-run -a node scripts/smoke-linux.mjs /opt/Shellherd/shellherd
          xvfb-run -a node scripts/toolbar-smoke.mjs /opt/Shellherd/shellherd
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            dist/Shellherd-Setup-*.exe
            dist/Shellherd-Portable-*.exe
            dist/Shellherd-*.AppImage
            dist/Shellherd-*.deb

  release:
    needs: [version, build]
    if: needs.version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-x64'
          path: dist
          merge-multiple: true
      - run: node scripts/release-notes.mjs "$TAG" > release-notes.md
      - name: Prepare installer and checksums
        run: |
          cp install.sh install.ps1 dist/
          cd dist
          sha256sum *.exe *.AppImage *.deb install.sh install.ps1 > SHA256SUMS
      # A draft is invisible publicly until every asset has uploaded successfully.
      # A failed publication can be retried without creating a second release.
      - name: Stage release and upload all installers
        shell: bash
        run: |
          test -n "$(find dist -name 'Shellherd-Setup-*.exe' -print -quit)"
          test -n "$(find dist -name 'Shellherd-Portable-*.exe' -print -quit)"
          test -n "$(find dist -name 'Shellherd-*.AppImage' -print -quit)"
          test -n "$(find dist -name 'Shellherd-*.deb' -print -quit)"
          if gh release view "$TAG" --json isDraft --jq '.isDraft' > draft-state; then
            test "$(cat draft-state)" = true
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Shellherd ${TAG#v}" --notes-file release-notes.md
          fi
          gh release upload "$TAG" dist/*.exe dist/*.AppImage dist/*.deb dist/install.sh dist/install.ps1 dist/SHA256SUMS --clobber
          gh release edit "$TAG" --draft=false --latest
